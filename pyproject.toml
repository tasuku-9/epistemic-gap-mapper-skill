[project]
name = "epistemic-gap-mapper"
version = "0.1.0"
description = "Prompt and schema based skill for mapping frame-challenging hypotheses"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]
readme = "README.md"
license = {text = "CC-BY-4.0 for docs; MIT for code"}

[project.scripts]
egm = "egm.cli:main"

[tool.setuptools]
packages = ["egm", "scripts", "schemas"]

[tool.setuptools.package-data]
schemas = ["*.json"]

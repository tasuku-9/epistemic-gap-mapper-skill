name: Validate samples

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator and test dependencies
        run: python -m pip install -r scripts/requirements.txt pytest
      - name: Run semantic and provenance regression tests
        run: python -m pytest -q
      - name: Validate source-grounded calibration fixture
        run: python scripts/egm_cli.py validate examples/calibration_local_support/nodes_calibration.json
      - name: Validate starter sample graph
        run: python scripts/egm_cli.py validate examples/starter_cafe_rain/nodes_starter.json
      - name: Validate minimal sample graph
        run: python scripts/egm_cli.py validate examples/jomon_dotaku_kiki/nodes_minimal.json
      - name: Validate sample graph
        run: python scripts/egm_cli.py validate examples/jomon_dotaku_kiki/nodes_sample.json
      - name: Validate full sample graph
        run: python scripts/egm_cli.py validate examples/jomon_dotaku_kiki/nodes_full.json
      - name: Validate template graph
        run: python scripts/egm_cli.py validate templates/nodes_template.json
      - name: Render full sample graph
        run: python scripts/egm_cli.py render examples/jomon_dotaku_kiki/nodes_full.json --mermaid

name: Validate samples

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sample graph
        run: python scripts/egm_cli.py validate examples/jomon_dotaku_kiki/nodes_sample.json
      - name: Render sample graph
        run: python scripts/egm_cli.py render examples/jomon_dotaku_kiki/nodes_sample.json --mermaid
